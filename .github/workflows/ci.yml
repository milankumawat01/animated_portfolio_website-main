name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # The QA suite drives a real browser. On CI we use Playwright's own
      # Chromium; locally scripts/qa.mjs uses the installed Chrome because the
      # Playwright download is blocked on the dev machine.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright suite
        run: pnpm exec playwright test
        env:
          CI: 'true'

      - name: QA sweep
        run: node scripts/qa.mjs --no-build --ci
        env:
          CI: 'true'

      - name: Performance budgets
        run: node scripts/check-budgets.mjs --no-build --ci
        env:
          CI: 'true'

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            playwright-report/
            test-results/
            .probe/
          if-no-files-found: ignore
